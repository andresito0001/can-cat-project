server:
  port: 8080

spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true 
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
  mail:
    host: smtp.gmail.com
    port: 587
    username: tu-email@gmail.com
    password: xxxx xxxx xxxx xxxx 
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
          
app:
  jwt:
    secret: ClaveSuperSecretaYMuylargaParaFirmarTokensJWT1234567890abcdefghijklmnopqrstuvwxyz
    # 86400000 ms = 24 horas
    expiration-ms: 86400000

