server:
  port: ${SERVER_PORT:8080}

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/can-cat-system}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:cambia_este_correo@gmail.com}
    password: ${MAIL_PASSWORD:cambia_esta_password_de_app}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

# Configuración JWT
jwt:
  secret: ${JWT_SECRET:cambia_esta_clave_por_una_de_al_menos_64_caracteres_aleatorios}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  password-reset-expiration-ms: ${JWT_PASSWORD_RESET_EXPIRATION_MS:86400000}

# Logging
logging:
  level:
    com.cancat: ${LOG_LEVEL_APP:INFO}
    com.udo.can_cat: ${LOG_LEVEL_APP:INFO}
    org.springframework.security: ${LOG_LEVEL_SECURITY:INFO}

# ══════════════════════════════════════════════════════===
# Datos bancarios de la clínica (para que el cliente pague)
# ══════════════════════════════════════════════════════===
app:
  frontend:
    url: ${APP_FRONTEND_URL:http://localhost:5173}
  impuestos:
    iva-porcentaje: ${IVA_PORCENTAJE:16.00}
  banco:
    nombre-titular: ${BANCO_NOMBRE_TITULAR:Clínica Veterinaria CanCat}
    rif: ${BANCO_RIF:J-12345678-9}
    banco-principal:
      codigo: ${BANCO_CODIGO:0102}
      nombre: ${BANCO_NOMBRE:Banco de Venezuela}
      cuenta: ${BANCO_CUENTA:0102-0123-45-6789012345}
      tipo: ${BANCO_TIPO:Corriente}
    pago-movil:
      banco: ${PAGO_MOVIL_BANCO:Banesco (0134)}
      telefono: ${PAGO_MOVIL_TELEFONO:0414-1234567}
      cedula: ${PAGO_MOVIL_CEDULA:J-12345678-9}
    horario-atencion: ${BANCO_HORARIO:Lunes a Viernes, 8:00 a.m. - 5:00 p.m.}
    nota: ${BANCO_NOTA:Envía el comprobante por WhatsApp al número de Pago Móvil después de transferir.}